# Render Blueprint for Tobaz Autos Monorepo

services:
  # Backend: Django Web Service
  - type: web
    name: tobaz-autos-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn tobaz_autos.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --threads 4 --timeout 60"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: tobaz-autos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "tobaz-autos-backend.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://tobaz-autos-frontend.onrender.com,http://localhost:5173"
      - key: ADMIN_PASSWORD
        sync: false

  # Frontend: React Static Site
  - type: static
    name: tobaz-autos-frontend
    runtime: static
    plan: starter
    rootDir: frontend
    buildCommand: "npm install --legacy-peer-deps && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_URL
        fromService:
          name: tobaz-autos-backend
          type: web
          property: host
          template: "https://{{.host}}/api"
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: tobaz-autos-db
    plan: starter
    databaseName: tobaz_autos
    user: tobaz_autos_user
    ipAllowList: []
